<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Under Pressure</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-main: #c9d1d9;
            --text-accent: #58a6ff;
            --alert-color: #f85149;
            --button-bg: #21262d;
            --button-hover: #30363d;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace; /* Retro terminal feel */
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        #game-container {
            width: 100%;
            max-width: 600px; /* Keeps it readable on large screens, perfect for mobile */
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: var(--text-accent);
            text-align: center;
            font-size: 1.5rem;
            margin-top: 0;
            text-transform: uppercase;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .critical {
            color: var(--alert-color);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.5; }
        }

        /* Image Placeholder */
        #scene-image-container {
            width: 100%;
            height: 200px;
            background-color: #000;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        #scene-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Stats Bar */
        #stats-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .stat { margin: 2px 5px; }

        /* Story Text */
        #story-text {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 100px;
            white-space: pre-wrap; /* Respects line breaks in our text strings */
        }

        /* Buttons */
        .choice-btn {
            display: block;
            width: 100%;
            background-color: var(--button-bg);
            color: var(--text-accent);
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .choice-btn:hover {
            background-color: var(--button-hover);
        }

        /* End Screen Formatting */
        .end-stat { font-size: 1.2rem; margin: 10px 0; }
        .score-highlight { color: #3fb950; font-weight: bold; font-size: 1.5rem;}
        .center-text { text-align: center; }

    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="game-title">Architect Under Pressure</h1>
        
        <div id="game-ui">
            <div class="header-bar">
                <span>Health: <span class="critical">CRITICAL</span></span>
                <span id="time-display">2:17 AM</span>
            </div>

            <div id="scene-image-container">
                <img id="scene-image" src="ops_room.jpg" alt="Operations Room" onerror="this.style.display='none'; this.parentElement.innerHTML='[ Pixel Art: Dark Ops Room ]';">
            </div>

            <div id="stats-bar">
                <div class="stat">REL: <span id="stat-rel">50</span></div>
                <div class="stat">SEC: <span id="stat-sec">50</span></div>
                <div class="stat">CST: <span id="stat-cst">50</span></div>
                <div class="stat">SPD: <span id="stat-spd">50</span></div>
                <div class="stat">JUD: <span id="stat-jud">50</span></div>
            </div>

            <div id="story-text">Loading...</div>
            <div id="choices-container"></div>
        </div>
    </div>

    <script>
	// ==========================================
        // 1. GAME DATA (EASY TO EDIT)
        // ==========================================
        const gameData = [
            {
                id: 1, 
                time: "2:17 AM",
                image: "ops_room.jpg",
                text: "Production alert. Customer traffic suddenly increased 14x. The website is slowing down and database CPU is at 97%.\n\nCEO: 'We cannot go offline. Fix this.'",
                choices: [
                    { 
                        text: "[ Upgrade the database immediately ]", 
                        effects: { rel: 10, sec: 0, cost: -15, spd: 10, jud: -5 },
                        nextScene: 2 
                    },
                    { 
                        text: "[ Add more application servers ]", 
                        effects: { rel: -5, sec: 0, cost: -10, spd: 5, jud: -10 },
                        nextScene: 2 
                    },
                    { 
                        text: "[ Check the database/query metrics first ]", 
                        effects: { rel: 5, sec: 0, cost: 0, spd: -5, jud: 15 },
                        nextScene: 2 
                    },
                    { 
                        text: "[ Restart everything ]", 
                        effects: { rel: -20, sec: 0, cost: 0, spd: -10, jud: -20 },
                        nextScene: 2 
                    }
                ]
            },
            {
                id: 2, 
                time: "2:24 AM",
                image: "ops_room.jpg",
                text: "You bought some breathing room. The CPU dipped briefly, but now you are seeing a massive spike in failed login attempts. It might be a credential stuffing attack disguised as traffic.\n\nWhat is your next move?",
                choices: [
                    { 
                        text: "[ Block the suspicious IP ranges ]", 
                        effects: { rel: 5, sec: 15, cost: 0, spd: 5, jud: 10 },
                        nextScene: 3 
                    },
                    { 
                        text: "[ Ignore it, keep scaling servers ]", 
                        effects: { rel: -10, sec: -20, cost: -20, spd: 10, jud: -15 },
                        nextScene: 3 
                    },
                    { 
                        text: "[ Force password resets for affected users ]", 
                        effects: { rel: -10, sec: 20, cost: 0, spd: -10, jud: 5 },
                        nextScene: 3 
                    }
                ]
            },
            {
                id: 3, 
                time: "2:41 AM",
                image: "ops_room.jpg",
                text: "The security threat is mitigated, but the massive logs generated by the attack just filled up your primary storage drive. The system is rejecting new customer orders because it can't save them.",
                choices: [
                    { 
                        text: "[ Provision a massive new storage drive ]", 
                        effects: { rel: 15, sec: 0, cost: -25, spd: 10, jud: -5 },
                        nextScene: 4 
                    },
                    { 
                        text: "[ Write a script to delete old log files ]", 
                        effects: { rel: -10, sec: -10, cost: 10, spd: -15, jud: -5 },
                        nextScene: 4 
                    },
                    { 
                        text: "[ Compress the logs and move them to cold storage ]", 
                        effects: { rel: 10, sec: 5, cost: -5, spd: -5, jud: 15 },
                        nextScene: 4 
                    }
                ]
            },
            {
                id: 4, 
                time: "3:15 AM",
                image: "ops_room.jpg",
                text: "Orders are flowing again. Suddenly, your main cloud provider announces a major outage in the 'US-East' region. Half of your servers just vanished.",
                choices: [
                    { 
                        text: "[ Manually route all traffic to 'US-West' ]", 
                        effects: { rel: 10, sec: 0, cost: -10, spd: -5, jud: 10 },
                        nextScene: 5 
                    },
                    { 
                        text: "[ Wait for the provider to fix the outage ]", 
                        effects: { rel: -25, sec: 0, cost: 15, spd: -20, jud: -20 },
                        nextScene: 5 
                    },
                    { 
                        text: "[ Trigger the automated disaster recovery plan ]", 
                        effects: { rel: 20, sec: 0, cost: -20, spd: 15, jud: 15 },
                        nextScene: 5 
                    }
                ]
            },
            {
                id: 5, 
                time: "3:50 AM",
                image: "ops_room.jpg",
                text: "The system stabilizes. Just as you go to grab coffee, the CEO messages again:\n\n'Great job keeping us alive. Since traffic is so high, let's launch the new beta feature right now to capitalize on it.'",
                choices: [
                    { 
                        text: "[ 'Yes sir, deploying beta now.' ]", 
                        effects: { rel: -30, sec: -15, cost: -10, spd: 10, jud: -30 },
                        nextScene: "END" 
                    },
                    { 
                        text: "[ 'No, the system is too fragile right now.' ]", 
                        effects: { rel: 15, sec: 10, cost: 0, spd: -5, jud: 20 },
                        nextScene: "END" 
                    },
                    { 
                        text: "[ Deploy it, but only to 5% of users ]", 
                        effects: { rel: 5, sec: 5, cost: -5, spd: 0, jud: 15 },
                        nextScene: "END" 
                    }
                ]
            }
        ];

        // ==========================================
        // 2. GAME ENGINE LOGIC
        // ==========================================
        
        let stats = { rel: 50, sec: 50, cost: 50, spd: 50, jud: 50 };

        // DOM Elements
        const storyTextEl = document.getElementById("story-text");
        const choicesContainerEl = document.getElementById("choices-container");
        const timeDisplayEl = document.getElementById("time-display");
        const sceneImageEl = document.getElementById("scene-image");
        const gameUiEl = document.getElementById("game-ui");
        const gameContainerEl = document.getElementById("game-container");
        const titleEl = document.getElementById("game-title");

        function updateStatsUI() {
            document.getElementById("stat-rel").innerText = stats.rel;
            document.getElementById("stat-sec").innerText = stats.sec;
            document.getElementById("stat-cst").innerText = stats.cost;
            document.getElementById("stat-spd").innerText = stats.spd;
            document.getElementById("stat-jud").innerText = stats.jud;
        }

        function loadScene(sceneId) {
            if (sceneId === "END") {
                showEndScreen();
                return;
            }

            // Find the scene in our data array
            const scene = gameData.find(s => s.id === sceneId);
            if (!scene) return;

            // Update UI Elements
            timeDisplayEl.innerText = scene.time;
            storyTextEl.innerText = scene.text;
            sceneImageEl.src = scene.image;
            
            // Clear old buttons
            choicesContainerEl.innerHTML = "";

            // Create new buttons
            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => handleChoice(choice);
                choicesContainerEl.appendChild(btn);
            });
        }

        function handleChoice(choice) {
            // Apply stat effects
            stats.rel += choice.effects.rel;
            stats.sec += choice.effects.sec;
            stats.cost += choice.effects.cost;
            stats.spd += choice.effects.spd;
            stats.jud += choice.effects.jud;

            // Keep stats between 0 and 100
            for (let key in stats) {
                if (stats[key] > 100) stats[key] = 100;
                if (stats[key] < 0) stats[key] = 0;
            }

            updateStatsUI();
            
            // Move to next scene
            loadScene(choice.nextScene);
        }

        function showEndScreen() {
            // Calculate average score
            const totalScore = Math.round((stats.rel + stats.sec + stats.cost + stats.spd + stats.jud) / 5);
            
            // Determine Player Profile Archetype (Basic logic for V1)
            let profileTitle = "The Operator";
            let profileDesc = "You kept the system alive under pressure, but there is always room for optimization.";
            
            if (stats.cost < 40) {
                profileTitle = "The Big Spender";
                profileDesc = "You fixed the problem by throwing money and servers at it. Effective, but the CFO wants a word.";
            } else if (stats.jud > 70) {
                profileTitle = "The True Architect";
                profileDesc = "Calm, analytical, and precise. You diagnosed the root cause before taking action.";
            }

            titleEl.innerText = "INCIDENT RESOLVED";

            gameUiEl.innerHTML = `
                <div class="center-text">
                    <p>Architecture Score: <span class="score-highlight">${totalScore} / 100</span></p>
                    <hr style="border-color: var(--border-color); margin: 20px 0;">
                    
                    <div class="end-stat">Reliability: ${stats.rel}</div>
                    <div class="end-stat">Security: ${stats.sec}</div>
                    <div class="end-stat">Cost: ${stats.cost}</div>
                    <div class="end-stat">Speed: ${stats.spd}</div>
                    <div class="end-stat">Judgment: ${stats.jud}</div>
                    
                    <hr style="border-color: var(--border-color); margin: 20px 0;">
                    <h2 style="color: var(--text-accent);">${profileTitle}</h2>
                    <p style="margin-bottom: 30px;">"${profileDesc}"</p>
                    
                    <button class="choice-btn" onclick="location.reload()" style="text-align: center;">[ Play Again ]</button>
                    <button class="choice-btn" style="text-align: center; border-color: var(--alert-color); color: var(--alert-color);" onclick="alert('This will redirect to the consulting website!')">[ Stress-Test My Real Architecture ]</button>
                </div>
            `;
        }

        // Initialize Game
        updateStatsUI();
        loadScene(1);

    </script>
</body>
</html>
