<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Under Pressure</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-main: #c9d1d9;
            --text-accent: #58a6ff;
            --alert-color: #f85149;
            --warning-color: #d29922;
            --stable-color: #3fb950;
            --button-bg: #21262d;
            --button-hover: #30363d;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        #game-container {
            width: 100%;
            max-width: 600px; 
            background-color: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px; /* Slightly reduced for mobile */
            box-sizing: border-box;
        }

        h1 {
            color: var(--text-accent);
            text-align: center;
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #decision-tracker {
            text-align: center;
            font-size: 0.8rem;
            color: #8b949e;
            margin-bottom: 10px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #env-metrics {
            font-size: 0.9rem;
            margin-bottom: 15px;
            padding: 8px;
            background-color: rgba(0,0,0,0.3);
            border-radius: 4px;
            text-align: center;
        }

        .status-critical { color: var(--alert-color); animation: blink 1.5s infinite; }
        .status-degraded { color: var(--warning-color); }
        .status-stable { color: var(--stable-color); }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* Image Placeholder - Height reduced for mobile */
        #scene-image-container {
            width: 100%;
            height: 120px; 
            background-color: #000;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        #scene-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Stats Bar */
        #stats-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background-color: var(--bg-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.80rem;
        }

        .stat { margin: 2px 3px; }

        /* Story Text */
        #story-text, #consequence-text {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 15px;
            white-space: pre-wrap; 
        }

        #consequence-text {
            color: var(--warning-color);
            border-left: 3px solid var(--warning-color);
            padding-left: 10px;
            display: none; /* Hidden until a choice is made */
        }

        /* Buttons */
        .choice-btn, .continue-btn {
            display: block;
            width: 100%;
            background-color: var(--button-bg);
            color: var(--text-accent);
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .choice-btn:hover, .continue-btn:hover { background-color: var(--button-hover); }
        
        .continue-btn {
            text-align: center;
            border-color: var(--stable-color);
            color: var(--stable-color);
            display: none;
        }

        /* End Screen Formatting */
        .end-stat { font-size: 1.1rem; margin: 8px 0; }
        .center-text { text-align: center; }

    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="game-title">Architect Under Pressure</h1>
        <div id="decision-tracker">Decision 1 of 5</div>
        
        <div id="game-ui">
            <div class="header-bar">
                <span>Status: <span id="env-status" class="status-critical">CRITICAL</span></span>
                <span id="time-display">2:17 AM</span>
            </div>
            
            <div id="env-metrics" class="status-critical">DB CPU: 97% | Response Time: 4.2s</div>

            <div id="scene-image-container">
                <img id="scene-image" src="ops_room.jpg" alt="Operations Room" onerror="this.style.display='none'; this.parentElement.innerHTML='[ Pixel Art: Dark Ops Room ]';">
            </div>

            <div id="stats-bar">
                <div class="stat">REL: <span id="stat-rel">50</span></div>
                <div class="stat">SEC: <span id="stat-sec">50</span></div>
                <div class="stat">CST-EFF: <span id="stat-cst">50</span></div>
                <div class="stat">SPD: <span id="stat-spd">50</span></div>
                <div class="stat">JUD: <span id="stat-jud">50</span></div>
            </div>

            <div id="story-text">Loading...</div>
            <div id="consequence-text"></div>
            
            <div id="choices-container"></div>
            <button id="continue-btn" class="continue-btn" onclick="advanceScene()">[ Continue ]</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. GAME DATA
        // ==========================================
        const gameData = [
            {
                id: 1, 
                time: "2:17 AM",
                image: "ops_room.jpg",
                text: "Production alert. Customer traffic suddenly increased 14x. The website is slowing down and database CPU is at 97%.\n\nCEO: 'We cannot go offline. Fix this.'",
                choices: [
                    { 
                        text: "[ Upgrade the database immediately ]", 
                        effects: { rel: 10, sec: 0, cost: -15, spd: 10, jud: -5 },
                        consequence: "Response times improve, but the expensive query is still consuming resources. Cost efficiency drops significantly.",
                        newStatus: "DEGRADED",
                        newMetrics: "DB CPU: 80% | Response Time: 1.8s",
                        nextScene: 2 
                    },
                    { 
                        text: "[ Add more application servers ]", 
                        effects: { rel: -5, sec: 0, cost: -10, spd: 5, jud: -10 },
                        consequence: "New servers spin up, but the database is still the bottleneck. The system remains highly strained.",
                        newStatus: "CRITICAL",
                        newMetrics: "DB CPU: 99% | Response Time: 4.5s",
                        nextScene: 2 
                    },
                    { 
                        text: "[ Check the database/query metrics first ]", 
                        effects: { rel: 5, sec: 0, cost: 0, spd: -5, jud: 15 },
                        consequence: "You identify a rogue query from a marketing dashboard causing the spike. You kill the query.",
                        newStatus: "STABLE",
                        newMetrics: "DB CPU: 40% | Response Time: 0.3s",
                        nextScene: 2 
                    }
                ]
            },
            {
                id: 2, 
                time: "2:24 AM",
                image: "ops_room.jpg",
                text: "You managed the CPU spike. However, you are now seeing a massive flood of failed login attempts. It looks like a credential stuffing attack disguised as traffic.\n\nWhat is your next move?",
                choices: [
                    { 
                        text: "[ Block the suspicious IP ranges ]", 
                        effects: { rel: 5, sec: 15, cost: 0, spd: 5, jud: 10 },
                        consequence: "The attack traffic drops off. A few legitimate users are caught in the IP ban, but the system is secure.",
                        newStatus: "STABLE",
                        newMetrics: "Logins: Normal | Threat Level: Low",
                        nextScene: 3 
                    },
                    { 
                        text: "[ Ignore it, keep scaling servers ]", 
                        effects: { rel: -10, sec: -20, cost: -20, spd: 10, jud: -15 },
                        consequence: "The servers stay up, but attackers successfully breach several dozen customer accounts. Security is severely compromised.",
                        newStatus: "CRITICAL",
                        newMetrics: "Logins: Spiking | Threat Level: HIGH",
                        nextScene: 3 
                    }
                ]
            },
            {
                id: 3, 
                time: "2:41 AM",
                image: "ops_room.jpg",
                text: "The security event passes, but the massive logs generated by the attack just filled up your primary storage drive. The system is rejecting new customer orders.",
                choices: [
                    { 
                        text: "[ Provision a massive new storage drive ]", 
                        effects: { rel: 15, sec: 0, cost: -25, spd: 10, jud: -5 },
                        consequence: "Storage capacity is restored instantly. Orders process again, but you just added a massive recurring cost to the infrastructure.",
                        newStatus: "STABLE",
                        newMetrics: "Storage: 15% Used | Orders: Flowing",
                        nextScene: 4 
                    },
                    { 
                        text: "[ Write a script to delete old log files ]", 
                        effects: { rel: -10, sec: -10, cost: 10, spd: -15, jud: -5 },
                        consequence: "You delete the logs to make space. Orders resume, but you just destroyed the forensic data needed to investigate the previous attack.",
                        newStatus: "DEGRADED",
                        newMetrics: "Storage: 60% Used | Orders: Slow",
                        nextScene: 4 
                    }
                ]
            },
            {
                id: 4, 
                time: "3:15 AM",
                image: "ops_room.jpg",
                text: "Orders are flowing again. Suddenly, your main cloud provider announces a major outage in the 'US-East' region. Half of your servers just vanished.",
                choices: [
                    { 
                        text: "[ Manually route all traffic to 'US-West' ]", 
                        effects: { rel: 10, sec: 0, cost: -10, spd: -5, jud: 10 },
                        consequence: "Traffic successfully diverts. US-West is struggling under the double load, but it's holding together.",
                        newStatus: "DEGRADED",
                        newMetrics: "US-West Load: 92% | US-East: Offline",
                        nextScene: 5 
                    },
                    { 
                        text: "[ Wait for the provider to fix the outage ]", 
                        effects: { rel: -25, sec: 0, cost: 15, spd: -20, jud: -20 },
                        consequence: "You wait. 50% of your global customers experience total downtime for the next 45 minutes.",
                        newStatus: "CRITICAL",
                        newMetrics: "US-West Load: Normal | US-East: Offline",
                        nextScene: 5 
                    }
                ]
            },
            {
                id: 5, 
                time: "3:50 AM",
                image: "ops_room.jpg",
                text: "The cloud provider recovers. Just as you go to grab coffee, the CEO messages again:\n\n'Great job. Since traffic is so high, let's launch the new beta feature right now to capitalize on it.'",
                choices: [
                    { 
                        text: "[ 'Yes sir, deploying beta now.' ]", 
                        effects: { rel: -30, sec: -15, cost: -10, spd: 10, jud: -30 },
                        consequence: "The untested beta code crashes production. The site goes down entirely.",
                        newStatus: "CRITICAL",
                        newMetrics: "System Offline",
                        nextScene: "END" 
                    },
                    { 
                        text: "[ 'No, the system is too fragile right now.' ]", 
                        effects: { rel: 15, sec: 10, cost: 0, spd: -5, jud: 20 },
                        consequence: "You push back. The CEO is annoyed, but production remains stable through the end of your shift.",
                        newStatus: "STABLE",
                        newMetrics: "System Stable",
                        nextScene: "END" 
                    }
                ]
            }
        ];

        // ==========================================
        // 2. GAME ENGINE LOGIC
        // ==========================================
        
        let stats = { rel: 50, sec: 50, cost: 50, spd: 50, jud: 50 };
        let currentDecision = 1;
        let pendingNextScene = null;

        // DOM Elements
        const storyTextEl = document.getElementById("story-text");
        const consequenceTextEl = document.getElementById("consequence-text");
        const choicesContainerEl = document.getElementById("choices-container");
        const timeDisplayEl = document.getElementById("time-display");
        const sceneImageEl = document.getElementById("scene-image");
        const gameUiEl = document.getElementById("game-ui");
        const titleEl = document.getElementById("game-title");
        const continueBtn = document.getElementById("continue-btn");
        const trackerEl = document.getElementById("decision-tracker");
        const envStatusEl = document.getElementById("env-status");
        const envMetricsEl = document.getElementById("env-metrics");

        function updateStatsUI() {
            document.getElementById("stat-rel").innerText = stats.rel;
            document.getElementById("stat-sec").innerText = stats.sec;
            document.getElementById("stat-cst").innerText = stats.cost;
            document.getElementById("stat-spd").innerText = stats.spd;
            document.getElementById("stat-jud").innerText = stats.jud;
        }

        function loadScene(sceneId) {
            if (sceneId === "END") {
                showEndScreen();
                return;
            }

            const scene = gameData.find(s => s.id === sceneId);
            if (!scene) return;

            // Reset UI for new scene
            timeDisplayEl.innerText = scene.time;
            storyTextEl.innerText = scene.text;
            sceneImageEl.src = scene.image;
            consequenceTextEl.style.display = "none";
            continueBtn.style.display = "none";
            trackerEl.innerText = `Decision ${currentDecision} of 5`;
            
            choicesContainerEl.innerHTML = "";

            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice.text;
                btn.onclick = () => handleChoice(choice);
                choicesContainerEl.appendChild(btn);
            });
        }

        function handleChoice(choice) {
            // Disable double-clicking by clearing choices immediately
            choicesContainerEl.innerHTML = "";

            // Apply stat effects
            stats.rel += choice.effects.rel;
            stats.sec += choice.effects.sec;
            stats.cost += choice.effects.cost;
            stats.spd += choice.effects.spd;
            stats.jud += choice.effects.jud;

            for (let key in stats) {
                if (stats[key] > 100) stats[key] = 100;
                if (stats[key] < 0) stats[key] = 0;
            }

            updateStatsUI();
            
            // Update visual environment
            envStatusEl.innerText = choice.newStatus;
            envMetricsEl.innerText = choice.newMetrics;
            
            // Change colors based on status
            envStatusEl.className = "";
            envMetricsEl.className = "";
            if (choice.newStatus === "CRITICAL") {
                envStatusEl.classList.add("status-critical");
                envMetricsEl.classList.add("status-critical");
            } else if (choice.newStatus === "DEGRADED") {
                envStatusEl.classList.add("status-degraded");
                envMetricsEl.classList.add("status-degraded");
            } else {
                envStatusEl.classList.add("status-stable");
                envMetricsEl.classList.add("status-stable");
            }

            // Show Consequence & Continue Button
            consequenceTextEl.innerText = ">> " + choice.consequence;
            consequenceTextEl.style.display = "block";
            
            pendingNextScene = choice.nextScene;
            continueBtn.style.display = "block";
            currentDecision++;
        }

        function advanceScene() {
            if (pendingNextScene) {
                loadScene(pendingNextScene);
            }
        }

        function showEndScreen() {
            trackerEl.style.display = "none";
            
            let endingTitle = "";
            let endingDesc = "";
            let titleColor = "";

            // Determine Ending Type based on actual stats
            if (stats.rel < 40 || stats.jud < 40) {
                endingTitle = "INCIDENT UNRESOLVED / ESCALATED";
                titleColor = "var(--alert-color)";
                endingDesc = "Production went down. Your decisions failed to restore the system or created a fatal cascade, causing severe outages.";
            } else if (stats.cost < 40 || stats.sec < 40) {
                endingTitle = "RECOVERY WITH MAJOR TRADEOFFS";
                titleColor = "var(--warning-color)";
                endingDesc = "You kept the system alive, but prioritized immediate recovery over everything else. You created significant cost and security debt in the process.";
            } else {
                endingTitle = "SUCCESSFUL RECOVERY";
                titleColor = "var(--stable-color)";
                endingDesc = "Excellent work. You solved the incident efficiently while managing costs, isolating security threats, and maintaining reliability.";
            }

            titleEl.innerText = "AFTERMATH REPORT";

            gameUiEl.innerHTML = `
                <div class="center-text">
                    <h2 style="color: ${titleColor}; margin-bottom: 5px;">${endingTitle}</h2>
                    <p style="margin-bottom: 20px;">"${endingDesc}"</p>
                    <hr style="border-color: var(--border-color); margin: 20px 0;">
                    
                    <div class="end-stat">Reliability: ${stats.rel}</div>
                    <div class="end-stat">Security: ${stats.sec}</div>
                    <div class="end-stat">Cost Efficiency: ${stats.cost}</div>
                    <div class="end-stat">Speed: ${stats.spd}</div>
                    <div class="end-stat">Judgment: ${stats.jud}</div>
                    
                    <hr style="border-color: var(--border-color); margin: 20px 0;">
                    
                    <button class="choice-btn" onclick="location.reload()" style="text-align: center;">[ Play Again ]</button>
                    <button class="choice-btn" style="text-align: center; border-color: var(--alert-color); color: var(--alert-color);" onclick="alert('This will redirect to the consulting website!')">[ Stress-Test My Real Architecture ]</button>
                </div>
            `;
        }

        // Initialize Game
        updateStatsUI();
        loadScene(1);

    </script>
</body>
</html>
