<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Adventurer!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b45;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            background-color: #87CEEB; 
            border: 4px solid #4a4a75;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            /* Optional: hides anything drawn outside the canvas borders */
            overflow: hidden; 
        }
        #instructions {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Go Adventurer!</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="instructions">
        <p>Press <strong>SPACEBAR</strong> to jump over the enemies!</p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Load Player Frames
        const playerFrames = [];
        for (let i = 1; i <= 4; i++) {
            let img = new Image();
            img.src = `player${i}.png`; 
            playerFrames.push(img);
        }

        // Load Enemy Image
        const enemyImage = new Image();
        enemyImage.src = 'enemy.png'; 

        // Load Background Image
        const backgroundImage = new Image();
        backgroundImage.src = 'background.png'; // Change to .jpg if your file is a JPEG

        let frames = 0;
        let score = 0;
        let gameOver = false;
        let nextEnemySpawn = 100;

        // Player Object
        const player = {
            x: 50,
            y: 200, 
            width: 100,  
            height: 150,
            dy: 0,
            gravity: 0.4,
            jumpPower: -14,
            grounded: false,
            
            frameX: 0,           
            maxFrames: 4,
            animationSpeed: 9,   

            draw: function() {
                if (playerFrames[this.frameX].complete && playerFrames[this.frameX].naturalWidth !== 0) {
                    ctx.drawImage(playerFrames[this.frameX], this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = "#FF8C00";
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            },

            update: function() {
                this.dy += this.gravity;
                this.y += this.dy;

                // Floor collision (Canvas height - 20px ground padding)
                if (this.y + this.height >= canvas.height - 20) {
                    this.y = canvas.height - 20 - this.height;
                    this.dy = 0;
                    this.grounded = true;
                } else {
                    this.grounded = false;
                }

                if (frames % this.animationSpeed === 0) {
                    if (this.grounded) {
                        this.frameX = (this.frameX + 1) % this.maxFrames;
                    } else {
                        this.frameX = 1; 
                    }
                }
            },

            jump: function() {
                if (this.grounded) {
                    this.dy = this.jumpPower;
                }
            }
        };

        const enemies = [];

        // Spawn Enemy Logic
        function spawnEnemy() {
            let enemy = {
                x: canvas.width,
                y: canvas.height - 95, 
                width: 85,
                height: 75,
                speed: 5,

                draw: function() {
                    if (enemyImage.complete && enemyImage.naturalWidth !== 0) {
                        ctx.drawImage(enemyImage, this.x, this.y, this.width, this.height);
                    } else {
                        ctx.fillStyle = "#8A2BE2";
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                    }
                },

                update: function() {
                    this.x -= this.speed;
                }
            };
            enemies.push(enemy);
        }

        // Controls
        window.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                if (gameOver) {
                    resetGame();
                } else {
                    player.jump();
                }
            }
        });

        // Reset Game
        function resetGame() {
            enemies.length = 0;
            score = 0;
            frames = 0;
            gameOver = false;
            player.y = 200;
            player.dy = 0;
            nextEnemySpawn = 100;
            gameLoop();
        }

        // Collision Detection
        function checkCollision(p, e) {
            let padding = 10; 
            return (
                p.x + padding < e.x + e.width - padding &&
                p.x + p.width - padding > e.x + padding &&
                p.y + padding < e.y + e.height - padding &&
                p.y + p.height - padding > e.y + padding
            );
        }

        // Main Game Loop
        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "40px Courier New";
                ctx.fillText("GAME OVER", 300, 200);
                ctx.font = "20px Courier New";
                ctx.fillText("Press SPACE to restart", 280, 250);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Image
            if (backgroundImage.complete && backgroundImage.naturalWidth !== 0) {
                // Scales the 960x262 image proportionally to fill the 400px height
                ctx.drawImage(backgroundImage, 0, 0, 1465, 400);
            }

            // Draw placeholder floor (Remove these two lines if your background image already has a drawn floor)
            ctx.fillStyle = "#6b8c42"; 
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            player.update();
            player.draw();

            // Handle Randomized Enemy Spawns
            if (frames >= nextEnemySpawn) { 
                spawnEnemy();
                let randomInterval = Math.floor(Math.random() * 100) + 80; 
                nextEnemySpawn = frames + randomInterval;
            }

            for (let i = 0; i < enemies.length; i++) {
                enemies[i].update();
                enemies[i].draw();

                if (checkCollision(player, enemies[i])) {
                    gameOver = true;
                }

                if (enemies[i].x + enemies[i].width < 0) {
                    enemies.splice(i, 1);
                    score += 10;
                    i--;
                }
            }

            // UI Score
            ctx.fillStyle = "black";
            ctx.font = "bold 20px Courier New";
            ctx.fillText("Score: " + score, 20, 30);

            frames++;
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
